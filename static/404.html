<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404: This page could not be found.</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="256x256" />
    <link rel="icon" href="/icon.png" type="image/png" sizes="1024x1024" />
    <link rel="apple-touch-icon" href="/apple-icon.png" type="image/png" sizes="1024x1024" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        padding: 20px;
        color: #fff;
        background: #0a0a0a;
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .shell {
        width: 100%;
        height: 100%;
        overflow: auto;
        border-radius: 12px;
        background: #171717;
        box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 5%);
      }

      .error {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji",
          "Segoe UI Emoji";
      }

      h1 {
        display: inline-block;
        margin: 0 20px 0 0;
        padding: 0 23px 0 0;
        border-right: 1px solid rgb(255 255 255 / 30%);
        font-size: 24px;
        font-weight: 500;
        vertical-align: top;
        line-height: 49px;
      }

      .message {
        display: inline-block;
      }

      h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 400;
        line-height: 49px;
      }

      @media (min-width: 768px) {
        body {
          padding: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="error">
        <div>
          <h1>404</h1>
          <div class="message"><h2>This page could not be found.</h2></div>
        </div>
      </div>
    </div>
  </body>
</html>
